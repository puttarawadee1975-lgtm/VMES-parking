  <text x="300" y="225" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">2กข 4321 NBI</text>
  
  <!-- Helmet Status Pill -->
  <rect x="220" y="235" width="160" height="16" fill="#ecfdf5" rx="4" />
  <text x="300" y="247" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PASS: HELMET WORN</text>
  
  <!-- Footer Banner -->
